  <style>
    .brain {
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      animation: draw 3s ease forwards;
    }
    
    @keyframes draw {
      to {
        stroke-dashoffset: 0;
      }
    }
    
    .pulse {
      animation: pulse 2s infinite;
      transform-origin: center;
      opacity: 0;
    }
    
    .pulse1 { animation-delay: 0.2s; }
    .pulse2 { animation-delay: 0.4s; }
    .pulse3 { animation-delay: 0.6s; }
    .pulse4 { animation-delay: 0.8s; }
    .pulse5 { animation-delay: 1.0s; }
    .pulse6 { animation-delay: 1.2s; }
    .pulse7 { animation-delay: 1.4s; }
    .pulse8 { animation-delay: 1.6s; }
    .pulse9 { animation-delay: 1.8s; }
    
    @keyframes pulse {
      0% {
        transform: scale(0);
        opacity: 1;
      }
      50% {
        transform: scale(1);
        opacity: 1;
      }
      100% {
        transform: scale(2);
        opacity: 0;
      }
    }
    
    .circuits {
      opacity: 0.7;
    }
  </style>
