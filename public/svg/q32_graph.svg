<svg width="480" height="390" viewBox="0 0 480 390" xmlns="http://www.w3.org/2000/svg">
  <style>
    .grid-line { stroke: #cccccc; stroke-width: 0.5; }
    .axis-line { stroke: black; stroke-width: 1.5; }
    .curve { stroke: black; stroke-width: 1.5; fill: none; }
    .tangent { stroke: black; stroke-width: 1.5; fill: none; stroke-dasharray: 4 2; }
    .label { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
    .tick-label { font-family: Arial, sans-serif; font-size: 12px; }
  </style>

  <!-- Defs for arrowheads -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>

  <!-- Grid -->
  <g id="grid">
    <!-- Vertical Grid Lines (each 30px, representing 2.5ms) -->
    <line x1="50" y1="20" x2="50" y2="350" class="grid-line" /> <!-- 0ms -->
    <line x1="80" y1="20" x2="80" y2="350" class="grid-line" /> <!-- 2.5ms -->
    <line x1="110" y1="20" x2="110" y2="350" class="grid-line" /> <!-- 5ms -->
    <line x1="140" y1="20" x2="140" y2="350" class="grid-line" /> <!-- 7.5ms -->
    <line x1="170" y1="20" x2="170" y2="350" class="grid-line" /> <!-- 10ms -->
    <line x1="200" y1="20" x2="200" y2="350" class="grid-line" /> <!-- 12.5ms -->
    <line x1="230" y1="20" x2="230" y2="350" class="grid-line" /> <!-- 15ms -->
    <line x1="260" y1="20" x2="260" y2="350" class="grid-line" /> <!-- 17.5ms -->
    <line x1="290" y1="20" x2="290" y2="350" class="grid-line" /> <!-- 20ms -->
    <line x1="320" y1="20" x2="320" y2="350" class="grid-line" /> <!-- 22.5ms -->
    <line x1="350" y1="20" x2="350" y2="350" class="grid-line" /> <!-- 25ms -->
    <line x1="380" y1="20" x2="380" y2="350" class="grid-line" /> <!-- 27.5ms -->
    <line x1="410" y1="20" x2="410" y2="350" class="grid-line" /> <!-- 30ms -->

    <!-- Horizontal Grid Lines (each 30px, representing 1V) -->
    <line x1="50" y1="20" x2="410" y2="20" class="grid-line" />   <!-- 11V -->
    <line x1="50" y1="50" x2="410" y2="50" class="grid-line" />   <!-- 10V -->
    <line x1="50" y1="80" x2="410" y2="80" class="grid-line" />   <!-- 9V -->
    <line x1="50" y1="110" x2="410" y2="110" class="grid-line" /> <!-- 8V -->
    <line x1="50" y1="140" x2="410" y2="140" class="grid-line" /> <!-- 7V -->
    <line x1="50" y1="170" x2="410" y2="170" class="grid-line" /> <!-- 6V -->
    <line x1="50" y1="200" x2="410" y2="200" class="grid-line" /> <!-- 5V -->
    <line x1="50" y1="230" x2="410" y2="230" class="grid-line" /> <!-- 4V -->
    <line x1="50" y1="260" x2="410" y2="260" class="grid-line" /> <!-- 3V -->
    <line x1="50" y1="290" x2="410" y2="290" class="grid-line" /> <!-- 2V -->
    <line x1="50" y1="320" x2="410" y2="320" class="grid-line" /> <!-- 1V -->
    <line x1="50" y1="350" x2="410" y2="350" class="grid-line" /> <!-- 0V -->
  </g>

  <!-- Axes -->
  <line x1="50" y1="350" x2="440" y2="350" class="axis-line" marker-end="url(#arrow)" /> <!-- X-axis -->
  <line x1="50" y1="350" x2="50" y2="10" class="axis-line" marker-end="url(#arrow)" />  <!-- Y-axis -->

  <!-- Curve -->
  <path d="M 50 350 C 90 150, 260 50, 350 50 L 410 50" class="curve" />

  <!-- Tangent Line -->
  <line x1="50" y1="350" x2="118" y2="10" class="tangent" />


  <!-- Labels and Ticks -->
  <text x="60" y="8" class="label" dominant-baseline="middle" text-anchor="start">u<tspan baseline-shift="sub" font-size="0.8em">R</tspan>(V)</text>
  <text x="455" y="365" class="label" text-anchor="middle">t(ms)</text>
  <text x="40" y="360" class="tick-label" text-anchor="middle">0</text>
  <text x="38" y="290" class="tick-label" text-anchor="end" dominant-baseline="middle">2</text>
  <text x="38" y="20" class="tick-label" text-anchor="end" dominant-baseline="middle">11</text>
  <text x="110" y="365" class="tick-label" text-anchor="middle">5</text>
  <text x="410" y="365" class="tick-label" text-anchor="middle">30</text>
</svg> 