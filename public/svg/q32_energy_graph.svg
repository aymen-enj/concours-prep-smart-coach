<svg width="480" height="390" viewBox="0 0 480 390" xmlns="http://www.w3.org/2000/svg">
  <style>
    .grid-line { stroke: #cccccc; stroke-width: 0.5; }
    .axis-line { stroke: black; stroke-width: 1.5; }
    .curve { stroke: black; stroke-width: 1.5; fill: none; }
    .label { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
    .tick-label { font-family: Arial, sans-serif; font-size: 12px; }
  </style>

  <!-- Defs for arrowheads -->
  <defs>
    <marker id="arrowEm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black" />
    </marker>
  </defs>

  <!-- Grid -->
  <g id="grid">
    <!-- Vertical Grid Lines (each 30px, representing 2.5ms) -->
    <line x1="50" y1="110" x2="50" y2="350" class="grid-line" /> <!-- 0ms -->
    <line x1="80" y1="110" x2="80" y2="350" class="grid-line" /> <!-- 2.5ms -->
    <line x1="110" y1="110" x2="110" y2="350" class="grid-line" /> <!-- 5ms -->
    <line x1="140" y1="110" x2="140" y2="350" class="grid-line" /> <!-- 7.5ms -->
    <line x1="170" y1="110" x2="170" y2="350" class="grid-line" /> <!-- 10ms -->
    <line x1="200" y1="110" x2="200" y2="350" class="grid-line" /> <!-- 12.5ms -->
    <line x1="230" y1="110" x2="230" y2="350" class="grid-line" /> <!-- 15ms -->
    <line x1="260" y1="110" x2="260" y2="350" class="grid-line" /> <!-- 17.5ms -->
    <line x1="290" y1="110" x2="290" y2="350" class="grid-line" /> <!-- 20ms -->
    <line x1="320" y1="110" x2="320" y2="350" class="grid-line" /> <!-- 22.5ms -->
    <line x1="350" y1="110" x2="350" y2="350" class="grid-line" /> <!-- 25ms -->
    <line x1="380" y1="110" x2="380" y2="350" class="grid-line" /> <!-- 27.5ms -->
    <line x1="410" y1="110" x2="410" y2="350" class="grid-line" /> <!-- 30ms -->

    <!-- Horizontal Grid Lines (each 30px, representing 1mJ) -->
    <line x1="50" y1="110" x2="410" y2="110" class="grid-line" /> <!-- 8mJ (Top of displayed grid lines) -->
    <line x1="50" y1="140" x2="410" y2="140" class="grid-line" /> <!-- 7mJ -->
    <line x1="50" y1="170" x2="410" y2="170" class="grid-line" /> <!-- 6mJ (Asymptote) -->
    <line x1="50" y1="200" x2="410" y2="200" class="grid-line" /> <!-- 5mJ -->
    <line x1="50" y1="230" x2="410" y2="230" class="grid-line" /> <!-- 4mJ -->
    <line x1="50" y1="260" x2="410" y2="260" class="grid-line" /> <!-- 3mJ -->
    <line x1="50" y1="290" x2="410" y2="290" class="grid-line" /> <!-- 2mJ -->
    <line x1="50" y1="320" x2="410" y2="320" class="grid-line" /> <!-- 1mJ -->
    <line x1="50" y1="350" x2="410" y2="350" class="grid-line" /> <!-- 0mJ -->
  </g>

  <!-- Axes -->
  <line x1="50" y1="350" x2="440" y2="350" class="axis-line" marker-end="url(#arrowEm)" /> <!-- X-axis -->
  <line x1="50" y1="350" x2="50" y2="100" class="axis-line" marker-end="url(#arrowEm)" />  <!-- Y-axis (top matches previous grid) -->

  <!-- Curve -->
  <path d="M 50 350 C 130 253, 260 170, 350 170 L 410 170" class="curve" />

  <!-- Labels and Ticks -->
  <!-- Y-axis label -->
  <text x="65" y="95" class="label" dominant-baseline="middle" text-anchor="start">E<tspan baseline-shift="sub" font-size="0.8em">m</tspan>(mJ)</text>
  <!-- X-axis label -->
  <text x="455" y="365" class="label" text-anchor="middle">t(ms)</text>

  <!-- Origin Tick -->
  <text x="40" y="360" class="tick-label" text-anchor="middle">0</text>

  <!-- Y-axis Tick (2mJ) -->
  <text x="38" y="290" class="tick-label" text-anchor="end" dominant-baseline="middle">2</text>

  <!-- X-axis Tick (5ms) -->
  <text x="110" y="365" class="tick-label" text-anchor="middle">5</text>
  <!-- X-axis Tick (30ms, to show the new end) -->
  <text x="410" y="365" class="tick-label" text-anchor="middle">30</text>

</svg> 