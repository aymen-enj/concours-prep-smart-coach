  <path class="filing" d="M60,64 l-0.5,-2.5" />

  <!-- Outer, sparser filings -->
  <path class="filing" d="M30,38 l2,1" />
  <path class="filing" d="M35,32 l1,2.5" />
  <path class="filing" d="M43,30 l-0.5,3" />
  <path class="filing" d="M50,28 l1.5,2.5" />
  <path class="filing" d="M58,30 l-1,2.5" />
  <path class="filing" d="M65,34 l2,1" />
