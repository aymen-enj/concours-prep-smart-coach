  <path class="filing" d="M39,59 l2,-3" />
  <path class="filing" d="M33,60 l2.5,1" />
  <path class="filing" d="M59,48 l3,1" />
  <path class="filing" d="M63,52 l0.5,2.5" />
  <path class="filing" d="M61,57 l2,-1.5" />
  <path class="filing" d="M65,60 l-2,1" />
