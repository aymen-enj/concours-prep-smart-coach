<svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    .filing {
      stroke: black;
      stroke-width: 1.2; /* Adjust for desired thickness of filings */
      fill: black;       /* Ensures they are solid, not just outlines if path closes */
      stroke-linecap: round; /* Makes the ends a bit softer, like filings */
    }
  </style>

  <!-- Central dense area - more filings, more overlap -->
  <path class="filing" d="M45,48 l3,1" />
  <path class="filing" d="M48,45 l1,3" />
  <path class="filing" d="M50,47 q1,3 -2,3.5" /> <!-- slight curve -->
  <path class="filing" d="M52,49 l-3,-1.5" />
  <path class="filing" d="M47,51 l3.5,0" />
  <path class="filing" d="M51,52.5 l-2,2.5" />
  <path class="filing" d="M49,55 l0.5,-3" />
  <path class="filing" d="M54,51.5 l-1.5,2.5" />
  <path class="filing" d="M44,53 l3,1.5" />
  <path class="filing" d="M46,43 l2,2.5" />
  <path class="filing" d="M53,43.5 l-2,2" />

  <!-- Prominent hooked/S-shaped filing near bottom-left of cluster -->
  <path class="filing" d="M43,58 q2,-3 4,-1 q-1,3.5 -3.5,2.5" stroke-width="1.8"/>

  <!-- Mid-density surrounding filings -->
  <path class="filing" d="M40,42 l2.5,1.5" />
